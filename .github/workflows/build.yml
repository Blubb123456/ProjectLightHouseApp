name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         

      - name: Install and Validate Dependencies
        run: |
          # Force legacy-peer-deps globally for ALL nested npm/expo operations
          export npm_config_legacy_peer_deps=true
          
          # 1. Base dependency install
          npm install
          
          # 2. Native dev client install
          npx expo install expo-dev-client
          
          # 3. FORCE the automatic alignment of the broken core modules
          npx expo install --fix
      
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean
      
      - name: Inject Fix into Existing Post_Install
        run: |
          cd ios
          ruby -e "
          path = 'Podfile'
          content = File.read(path)
          
          fix_logic = %q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # Fix graph validation errors
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['ARCHS'] = 'arm64'
                  config.build_settings['ONLY_ACTIVE_ARCH'] = 'NO'
                  
                  # Previous Xcode 16 environment fixes
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS'] = 'NO'
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['WERROR_NON_MODULAR_INCLUDE_IN_FRAMEWORK_MODULE'] = 'NO'
                end
              end
          }

          if content.include?('post_install do |installer|')
            content.gsub!('post_install do |installer|', \"post_install do |installer|\\n#{fix_logic}\")
            File.write(path, content)
            puts '✅ Podfile patched with centralized settings.'
          else
            puts '❌ Could not find post_install block.'
            exit 1
          end
          "
      
      - name: Set App Name Env
        run: |
          # Get name from package.json, strip non-alphanumeric
          NAME=$(jq -r .name package.json | tr -cd '[:alnum:]_')
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Build iOS archive (unsigned)
        run: |
          rm -rf build/DerivedData
          export REACT_NATIVE_PATH="$(pwd)/node_modules/react-native"
          
          # Force the React Native bundle script to run in asset mode
          export FORCE_BUNDLING=true
          export SKIP_BUNDLING=false
          
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            OTHER_CPLUSPLUSFLAGS="-Wno-error=non-modular-include-in-framework-module -Wno-error=return-type -Wno-error=reorder-ctor" \
            REACT_NATIVE_PATH="$REACT_NATIVE_PATH" \
            FORCE_BUNDLING=true \
            USE_HEADERMAP=NO \
            CLANG_ENABLE_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive
            
      - name: Package IPA
        run: |
          cd build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -rp *.app Payload/
          zip -r "DevClient.ipa" Payload
          mv "DevClient.ipa" $GITHUB_WORKSPACE/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DevClient-Build
          path: DevClient.ipa
