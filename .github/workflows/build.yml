name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      APP_NAME: "ProjectLightHouseReactApp"
    steps:
      - uses: actions/checkout@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Expo & dependencies
        run: |
          # Force an install to sync the lockfile on the runner
          npm install
          # Install the dev client specifically for this build
          npx expo install expo-dev-client

      - name: Add expo-dev-client
        run: npx expo install expo-dev-client
        
      - name: Prebuild and Install CocoaPods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install
          
      - name: Inject Fix into Existing Post_Install
        run: |
          cd ios
          ruby -e "
          path = 'Podfile'
          content = File.read(path)
          
          fix_logic = %q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # Fix Gun 1: Permissions/Sandboxing (Hermes Script Fix)
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  
                  # Fix Gun 2: Skip the Simulator SDK check during Asset compilation
                  config.build_settings['ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS'] = 'NO'
                  
                  # Standard Xcode 16 Modularity fixes
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['WERROR_NON_MODULAR_INCLUDE_IN_FRAMEWORK_MODULE'] = 'NO'
                  
                  # Ensure architecture is strictly ARM64 for the real-device archive
                  config.build_settings['SDKROOT'] = 'iphoneos'
                end
              end
          }

          if content.include?('post_install do |installer|')
            content.gsub!('post_install do |installer|', \"post_install do |installer|\\n#{fix_logic}\")
            File.write(path, content)
            puts '✅ Podfile patched with Sledgehammer fixes.'
          else
            puts '❌ Could not find post_install block.'
            exit 1
          end
          "
          
      - name: Read app name from package.json
        id: appname
        run: |
          RAW_NAME=$(jq -r .name package.json)
          SAFE_NAME=$(echo $RAW_NAME | tr -cd '[:alnum:]_')
          echo "APP_NAME=$SAFE_NAME" >> $GITHUB_ENV
      
      - name: Build iOS archive (unsigned)
        run: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          xcodebuild \
            -workspace ios/${{ env.APP_NAME }}.xcworkspace \
            -scheme "${{ env.APP_NAME }}" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \ 
            ARCHS=arm64 \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export IPA
        run: |
          cd build/${{ env.APP_NAME }}.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r ${{ env.APP_NAME }}.app Payload/
          zip -r ${{ env.APP_NAME }}.ipa Payload
          mv ${{ env.APP_NAME }}.ipa $GITHUB_WORKSPACE/
      
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
