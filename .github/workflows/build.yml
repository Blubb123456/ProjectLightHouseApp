name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         

      - name: Install and Fix Dependencies
        run: |
          # Force an install to sync the lockfile on the runner
          npm install
          # Install the dev client specifically for this build
          npx expo install expo-dev-client
      
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean
      
      - name: Inject Fix into Existing Post_Install
        run: |
          cd ios
          ruby -e "
          path = 'Podfile'
          content = File.read(path)
          
          fix_logic = %q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # Fix Gun 1: Permissions/Sandboxing (Hermes Script Fix)
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  
                  # Fix Gun 2: Skip the Simulator SDK check during Asset compilation
                  config.build_settings['ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS'] = 'NO'
                  
                  # Standard Xcode 16 Modularity fixes
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['WERROR_NON_MODULAR_INCLUDE_IN_FRAMEWORK_MODULE'] = 'NO'
                  
                  # Ensure architecture is strictly ARM64 for the real-device archive
                  config.build_settings['SDKROOT'] = 'iphoneos'
                end
              end
          }

          if content.include?('post_install do |installer|')
            content.gsub!('post_install do |installer|', \"post_install do |installer|\\n#{fix_logic}\")
            File.write(path, content)
            puts '✅ Podfile patched with Sledgehammer fixes.'
          else
            puts '❌ Could not find post_install block.'
            exit 1
          end
          "
      
      - name: Set App Name Env
        run: |
          # Get name from package.json, strip non-alphanumeric
          NAME=$(jq -r .name package.json | tr -cd '[:alnum:]_')
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Build iOS archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ARCHS=arm64
            
      - name: Package IPA
        run: |
          cd build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -rp *.app Payload/
          zip -r "DevClient.ipa" Payload
          mv "DevClient.ipa" $GITHUB_WORKSPACE/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DevClient-Build
          path: DevClient.ipa
