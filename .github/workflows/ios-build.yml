name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Xcode 16.x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @tensorflow/tfjs @tensorflow/tfjs-react-native expo-gl expo-camera expo-image-picker expo-file-system expo-constants expo-asset expo-font
          npm install --save-dev @expo/metro-config @react-native/metro-config
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Create Environment Override
        run: |
          cd ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/ || true
          
