name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          # Explicitly add every module Project Lighthouse needs to run
          npm install --save \
            @tensorflow/tfjs \
            @tensorflow/tfjs-react-native \
            expo-gl \
            expo-camera \
            expo-image-picker \
            expo-file-system \
            expo-constants \
            expo-asset \
            expo-font
          
          # Metro config tools
          npm install --save-dev @expo/metro-config @react-native/metro-config

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false
          use_frameworks! :linkage => :static

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # CRITICAL: Disable Sandboxing for Xcode 16/macOS 15
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                end
              end
            end
          end
          EOF
          pod install

      - name: Patch TensorFlow Native Code
        run: |
          # TensorFlow often fails on 'std::make_unique' in older C++ standards
          find node_modules/@tensorflow/tfjs-react-native -name "*.cpp" -exec sed -i '' 's/std::make_unique/std::unique_ptr/g' {} + || true

      - name: Manual JS Bundle
        run: |
          ENTRY_FILE="index.js"
          if [ ! -f "index.js" ]; then ENTRY_FILE="App.js"; fi
          
          # Create the bundle manually to bypass the broken Xcode script phase
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Build Unsigned Archive
        run: |
          # 1. Fix the Pathing for Hermes/React Native Scripts
          # This tells the 'with-environment.sh' script exactly where the project is
          export PROJECT_ROOT=$(pwd)
          export PODS_ROOT="$PROJECT_ROOT/ios/Pods"
          
          # 2. Re-create the environment helper just in case it's missing
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

          # 3. Find Workspace and Scheme
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | xargs basename)
          SCHEME=$(echo $WORKSPACE | cut -f 1 -d '.')

          # 4. The "Script-Safe" Build
          # We add 'EXTRA_PACKAGER_ARGS' and ensure the paths are linked
          set -o pipefail
          xcodebuild archive \
            -workspace ios/$WORKSPACE \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath $(pwd)/build/DerivedData \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
            -parallelizeTargets NO \
            ParallelizeTargets=NO \
            ARCHS=arm64 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            OTHER_CFLAGS="-D_B_INDEX_SKIP_" \
            PODS_ROOT="$PODS_ROOT" \
            clean archive | tee xcodebuild.log
      
      # 3. THE LOG CATCHER (Runs even if the step above fails)
      - name: Upload Xcode Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lighthouse-build-log
          path: xcodebuild.log
          
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then exit 1; fi
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
