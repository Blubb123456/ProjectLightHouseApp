name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Debug Path Verification
        run: |
          echo "Checking for with-environment.sh..."
          if [ -f "node_modules/react-native/scripts/xcode/with-environment.sh" ]; then
            echo "✅ Found at root node_modules"
          else
            echo "❌ NOT FOUND at root node_modules"
            find . -name "with-environment.sh"
          fi

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Podfile and Project
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['ON_DEMAND_RESOURCES_ENABLED'] = 'NO'
                  
                  # Force consistency to stop the "Disabling previews" noise
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['GCC_OPTIMIZATION_LEVEL'] = '0'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                end
                # Prevent glog from running its own internal scripts that fail in CI
                if target.name == 'glog'
                  target.build_phases.each do |phase|
                    if phase.respond_to?(:name) && phase.name.include?('Configure')
                      phase.shell_script = "echo 'Bypassing glog configuration'"
                    end
                  end
                end

                # Hermes Path Fix (From before)
                if target.name == 'hermes-engine'
                  target.build_phases.each do |phase|
                    if phase.respond_to?(:shell_script)
                      phase.shell_script = "export REACT_NATIVE_PATH=\"$PROJECT_DIR/../node_modules/react-native\"\n" + phase.shell_script
                    end
                  end
                end
              end

              # Fix for aggregate targets
              installer.aggregate_targets.each do |at|
                at.user_project.targets.each do |ut|
                  ut.build_configurations.each do |config|
                    config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                    config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                    config.build_settings['CODE_SIGN_IDENTITY'] = ''
                    config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  end
                end
                at.user_project.save
              end
            end
          end
          EOF
          pod install

      - name: Locate and Fix Glog
        run: |
          # Find where glog actually lives in this runner
          GLOG_PATH=$(find . -name "glog" -type d | grep "Pods/glog" | head -n 1)
          echo "Glog found at: $GLOG_PATH"
          
          if [ -z "$GLOG_PATH" ]; then
            echo "Glog directory not found. Creating it manually to satisfy compiler."
            mkdir -p ios/Pods/glog/src
            GLOG_PATH="ios/Pods/glog"
          fi

          cd "$GLOG_PATH"
          mkdir -p src
          
          # Create the files Xcode is looking for
          touch src/logging.cc
          touch src/raw_logging.cc
          touch src/utilities.cc
          touch src/vlog_is_on.cc
          touch src/symbolize.cc
          touch src/demangle.cc
          touch src/signalhandler.cc
          
          # Create a dummy config.h so it doesn't fail on missing headers
          echo "#define GOOGLE_GLOG_DLL_DECL" > src/config.h
          
          echo "Manual glog structure created."
          
      - name: Overwrite Hermes Source (Fixed Syntax)
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            python3 -c "
          import os
          path = '$FILE'
          with open(path, 'r') as f:
              content = f.read()

          # 1. Add missing headers
          if '#include <thread>' not in content:
              content = '#include <thread>\n#include <atomic>\n' + content

          # 2. Fix thread ID ambiguity
          content = content.replace('std::thread::id expected', 'auto expected')

          # 3. Fix the shared_ptr constructor (Surgical Replace)
          # We replace the specific make_shared call with the explicit 'new' allocation
          old_shared = 'std::make_shared<DecoratedRuntime>(runtime, debuggerName_)'
          new_shared = 'std::shared_ptr<DecoratedRuntime>(new DecoratedRuntime(runtime, debuggerName_))'
          content = content.replace(old_shared, new_shared)

          # 4. Fix the HermesExecutor constructor cast
          old_make_unique = 'return std::make_unique<HermesExecutor>(runtime,'
          new_make_unique = 'return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),'
          content = content.replace(old_make_unique, new_make_unique)

          with open(path, 'w') as f:
              f.write(content)
          "
            echo "✅ Source patched with fixed parentheses."
          fi
          
      - name: Build Unsigned Archive
        run: |
          # Manually fix glog if it's broken
          cd ios/Pods/glog && ./configure || true
          cd ../../../
          
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CC=clang \
            CXX=clang++ \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean archive
            
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
