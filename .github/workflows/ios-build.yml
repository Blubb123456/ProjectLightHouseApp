      - name: Patch Hermes for Xcode 16
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            echo "Patching HermesExecutorFactory.cpp..."
            sed -i '' 's/return delegate/return this->delegate/g' "$FILE"
          fi

      
      
      
      - name: Manual JS Bundle
        run: |
          npx expo export:embed --platform ios --dev false --bundle-output ios/main.jsbundle --assets-dest ios
      
      - name: Setup Xcode Environment
        run: |
          cd ios
          # This tells Xcode exactly where the Node binary and the environment scripts are
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          # Link the helper script if it's missing from the expected path
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/ || true
      
      
      
      - name: Bulletproof Patch for Hermes Executor
        run: |
          # 1. Reset the file to erase our previous sed damage
          git checkout node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp || true
          
          # 2. Use a Node script for safe, multiline regex replacement
          cat << 'EOF' > patch-hermes.js
          const fs = require('fs');
          const file = 'node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp';
          
          if (fs.existsSync(file)) {
            let code = fs.readFileSync(file, 'utf8');
            
            // Fix A: Add missing <thread> header for Xcode 16
            // (Resolves 'undeclared identifier expected' and 'no member named thread')
            if (!code.includes('#include <thread>')) {
              code = '#include <thread>\n' + code;
            }
            
            // Fix B: Explicit pointer cast
            // (Resolves 'static_cast from __compressed_pair... not related by inheritance')
            code = code.replace(
              /return std::make_unique<HermesExecutor>\(\s*decoratedRuntime,/g,
              'return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(decoratedRuntime),'
            );
            
            fs.writeFileSync(file, code);
            console.log('✅ Hermes patched successfully via Node.js.');
          } else {
            console.log('⚠️ HermesExecutorFactory.cpp not found.');
          }
          EOF
          
          node patch-hermes.js
          rm patch-hermes.js
          
      - name: Hard-Reset Podfile and Build
        run: |
          # 1. KILL ALL CACHES - Clean slate for Attempt 401
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

          # 2. OVERWRITE PODFILE - Using 'cat' to avoid Python syntax errors
          cat << 'EOF' > ios/Podfile
          platform :ios, '15.1'
          
          target 'ProjectLightHouseReactApp' do
            config = use_native_modules!
            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true
            )

            post_install do |installer|
              react_native_post_install(installer)
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # Force the environment to recognize 15.1
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  
                  # SILENCE THE COMPILER: This stops the Exit Code 65 Swift errors
                  config.build_settings['OTHER_SWIFT_FLAGS'] = [
                    '$(inherited)', 
                    '-no-verify-emitted-module-interface',
                    '-Xfrontend', 
                    '-disable-modules-validate-system-headers'
                  ]
                end
              end
            end
          end
          EOF

          # 3. FRESH INSTALL
          cd ios
          pod install --repo-update
          
          # 4. THE BUILD COMMAND - All flags included here as a backup
          cd ..
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -parallelizeTargets=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            OTHER_SWIFT_FLAGS="\$(inherited) -no-verify-emitted-module-interface -Xfrontend -disable-modules-validate-system-headers" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          
          # 1. Try to find the app inside the Archive first
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)

          # 2. Fallback: Search DerivedData if Archive failed
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Archive not found, searching DerivedData..."
            APP_PATH=$(find /tmp/DerivedData -name "ProjectLightHouseReactApp.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app file found in Archive or DerivedData."
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
