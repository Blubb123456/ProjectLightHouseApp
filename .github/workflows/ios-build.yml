name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @tensorflow/tfjs @tensorflow/tfjs-react-native expo-gl expo-camera expo-image-picker expo-file-system expo-constants expo-asset expo-font
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Inject Fix into Existing Post_Install
        run: |
          cd ios
          ruby -e "
          path = 'Podfile'
          content = File.read(path)
          
          # This is the fix for Xcode 16 Swift Optimization & Sandboxing
          fix_logic = %q{
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                end
              end
          }

          # We find the post_install line and inject our logic right after it starts
          if content.include?('post_install do |installer|')
            content.gsub!('post_install do |installer|', \"post_install do |installer|\\n#{fix_logic}\")
            File.write(path, content)
            puts '✅ Podfile patched successfully with Ruby.'
          else
            puts '❌ Could not find post_install block in Podfile.'
            exit 1
          end
          "

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Archive
        run: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
