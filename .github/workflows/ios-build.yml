name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Xcode 16.x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @tensorflow/tfjs @tensorflow/tfjs-react-native expo-gl expo-camera expo-image-picker expo-file-system expo-constants expo-asset expo-font
          npm install --save-dev @expo/metro-config @react-native/metro-config

      - name: Generate iOS Folder & Configure Podfile
        run: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          # We overwrite the Podfile with the correct syntax and the "Surgical Fixes"
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false
          use_frameworks! :linkage => :static

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # 1. Global Header & Modular Fixes
                  config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited) '
                  config.build_settings['HEADER_SEARCH_PATHS'] << '"$(PODS_ROOT)/Headers/Public" '
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  
                  # 2. Xcode 16 Permissions & Sandbox
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  
                  # 3. Optimization & Stability
                  config.build_settings['GCC_OPTIMIZATION_LEVEL'] = '0'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['COPY_PHASE_STRIP'] = 'NO'

                  if target.name == 'ZXingObjC'
                    config.build_settings['USER_HEADER_SEARCH_PATHS'] = '"$(PODS_ROOT)/ZXingObjC/**"'
                  end
                end
              end
            end
          end # This was the missing 'end' for the target block
          EOF
          
          pod install --repo-update

      - name: Manual JS Bundle
        run: |
          npx expo export:embed --platform ios --dev false --bundle-output ios/main.jsbundle --assets-dest ios

      - name: Build Unsigned Archive
        run: |
          # Discovery
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          DETECTED_SCHEME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$DETECTED_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/DerivedData \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
            -parallelizeTargets=NO \
            USE_HEADERMAP=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=non-modular-include-in-framework-module' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-error=non-modular-include-in-framework-module' \
            SWIFT_COMPILATION_MODE=singlefile \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee xcodebuild.log

      - name: Package IPA
        run: |
          # 1. Ensure we are in the right spot
          mkdir -p build/Payload
          
          # 2. Find the .app folder inside the archive
          # We use a broader search in case the archive name is slightly different
          APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app file found. The build likely failed."
            exit 1
          fi
          
          echo "Found App at: $APP_PATH"
          
          # 3. Copy to Payload and Zip
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
