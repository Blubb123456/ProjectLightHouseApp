name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Write Final Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  # This prevents the specific "1 argument vs 6" header confusion
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                end
              end
            end
          end
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Surgical Source Patch
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          
          if [ -f "$FILE" ]; then
            echo "Applying deep patches to $FILE..."
            
            # 1. Fix the shared_ptr instantiation (Line 207 area)
            # We bypass make_shared and use a direct constructor to avoid the template instantiation error
            sed -i '' 's/auto decoratedRuntime = std::make_shared<DecoratedRuntime>(/auto decoratedRuntime = std::shared_ptr<DecoratedRuntime>(new DecoratedRuntime(/g' "$FILE"
            
            # 2. Fix the HermesExecutor constructor call (Line 247 area)
            # We force the compiler to see it as the base jsi::Runtime pointer
            sed -i '' 's/return std::make_unique<HermesExecutor>(/return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),/g' "$FILE"
            
            echo "✅ Source patched."
          fi

          # 3. RUBY SURGERY: Fix paths and force C++ standards
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            abs_root = Dir.pwd
            
            project.targets.each do |target|
              # Fix the hermes script path error
              if target.name.include?("hermes-engine")
                target.build_phases.each do |phase|
                  if phase.isa == "PBXShellScriptBuildPhase"
                    phase.shell_script = "export REACT_NATIVE_PATH=\"#{abs_root}/node_modules/react-native\"\n" + phase.shell_script
                  end
                end
              end
              
              target.build_configurations.each do |config|
                config.build_settings["CLANG_CXX_LANGUAGE_STANDARD"] = "c++20"
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                config.build_settings["USE_HEADERMAP"] = "NO"
                # This flag allows the compiler to be less pedantic about header locations
                config.build_settings["OTHER_CPLUSPLUSFLAGS"] = "-Wno-error=non-modular-include-in-framework-module"
              end
            end
            project.save
          '

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            REACT_NATIVE_PATH="$(pwd)/node_modules/react-native" \
            USE_HEADERMAP=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
