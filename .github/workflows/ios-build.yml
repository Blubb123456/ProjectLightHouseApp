name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Write Final Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  # This prevents the specific "1 argument vs 6" header confusion
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                end
              end
            end
          end
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: High-Intensity Patching
        run: |
          # 1. Physically delete the public headers that are masking the real code
          find ios/Pods/Headers -name "HermesExecutorFactory.h" -delete
          
          # 2. Patch the .cpp file with the exact static pointer cast
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            sed -i '' 's/return std::make_unique<HermesExecutor>(/return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),/g' "$FILE"
          fi

          # 3. Force the header to expose the 6-arg constructor publicly
          HEADER="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.h"
          if [ -f "$HEADER" ]; then
            sed -i '' 's/class HermesExecutor : public JSIExecutor {/class HermesExecutor : public JSIExecutor { public:/g' "$HEADER"
          fi

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            USE_HEADERMAP=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
