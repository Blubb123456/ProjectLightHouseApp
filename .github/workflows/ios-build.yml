name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Back to Xcode 16 to satisfy the React Native check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @tensorflow/tfjs @tensorflow/tfjs-react-native expo-gl expo-camera expo-image-picker expo-file-system expo-constants expo-asset expo-font
      
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Inject Fixes into Podfile
        run: |
          cd ios
          # This appends a script to the end of your Podfile that forces Xcode 16 compatibility
          cat <<'EOF' >> Podfile

          post_install do |installer|
          installer.pods_project.targets.each do |target|
          target.build_configurations.each do |config|
          config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
          config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
          config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
              end
            end
          end
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Archive
        run: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
