name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          # Explicitly add every module Project Lighthouse needs to run
          npm install --save \
            @tensorflow/tfjs \
            @tensorflow/tfjs-react-native \
            expo-gl \
            expo-camera \
            expo-image-picker \
            expo-file-system \
            expo-constants \
            expo-asset \
            expo-font
          
          # Metro config tools
          npm install --save-dev @expo/metro-config @react-native/metro-config

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false
          use_frameworks! :linkage => :static

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # CRITICAL: Disable Sandboxing for Xcode 16/macOS 15
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                  config.build_settings['GCC_OPTIMIZATION_LEVEL'] = '0'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['COMPILER_INDEX_STORE_ENABLE'] = 'NO'
                  config.build_settings['GCC_GENERATE_DEBUGGING_SYMBOLS'] = 'NO'
                  config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                  config.build_settings['SWIFT_COMPILATION_MODE'] = 'singlefile'
                  config.build_settings['DEBUG_INFORMATION_FORMAT'] = 'dwarf'
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                  config.build_settings['ALWAYS_SEARCH_USER_PATHS'] = 'NO'
                  if target.name == 'hermes-engine'
                    target.build_phases.delete_if do |phase|
                    phase.respond_to?(:name) && phase.name.include?('Replace Hermes')
                      end
                    end
                end
              end
            end
          end
          EOF
          pod install

      - name: Patch TensorFlow Native Code
        run: |
          # TensorFlow often fails on 'std::make_unique' in older C++ standards
          find node_modules/@tensorflow/tfjs-react-native -name "*.cpp" -exec sed -i '' 's/std::make_unique/std::unique_ptr/g' {} + || true

      - name: Manual JS Bundle
        run: |
          ENTRY_FILE="index.js"
          if [ ! -f "index.js" ]; then ENTRY_FILE="App.js"; fi
          
          # Create the bundle manually to bypass the broken Xcode script phase
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios
      
      - name: Clear Xcode Daemons
        run: |
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          # This kills the background build coordinator that often hangs
          sudo killall -9 XcodeDefault || true     
      
      - name: Aggressive Cleanup & Manual Hermes Setup
        run: |
          # 1. Clear ~20GB of runner bloat
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          
          # 2. Manual Hermes Preparation
          # We unzip it here so Xcode's 'hermes-engine' target finds it ready
          echo "Preparing Hermes framework manually..."
          cd ios/Pods/hermes-engine
          unzip -o hermes-runtime-darwin.zip -d dest/ || true
          
          # 3. Check Disk Space (for your logs)
          echo "Current Disk Usage:"
          df -h
          cd ../../..
      
      - name: Maximize Runner Space & Pre-setup Hermes
        run: |
          # 1. Remove unnecessary Android/Dotnet/Haskell bloat to free ~20GB
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          
          # 2. Manually trigger the Hermes script so Xcode doesn't have to
          # This prevents the 'Internal Inconsistency' crash
          cd ios/Pods/hermes-engine
          if [ -f "dest/hermes.framework/hermes" ]; then
            echo "Hermes already unzipped."
          else
            echo "Manually unzipping Hermes..."
            # This is essentially what that failing script does
            unzip -o hermes-runtime-darwin.zip -d dest/ || true
          fi
          cd ../../..
          
      - name: Build Unsigned Archive
        run: |
          # 1. Environment & Pathing
          export NODE_BINARY=$(command -v node)
          echo "export NODE_BINARY=$NODE_BINARY" > ios/.xcode.env.local
          
          # 2. Manual JS Bundle (Reduces xcodebuild load)
          npx expo export:embed \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

          # 3. Dynamic Discovery
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          DETECTED_SCHEME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          # 4. The Archive Command
          # Added 'ENABLE_PREVIEWS=NO' to resolve the Swift Optimization note
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$DETECTED_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/DerivedData \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
            -parallelizeTargets=NO \
            USE_HEADERMAP=NO \
            DISABLE_MANUAL_TARGET_ORDER_PROCESSING=YES \
            CLANG_ENABLE_MODULE_DEBUGGING=NO \
            -resultBundlePath $(pwd)/build/ResultBundle.xcresult \
            ARCHS=arm64 \
            SWIFT_COMPILATION_MODE=singlefile \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            GCC_OPTIMIZATION_LEVEL="0" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee xcodebuild.log
      
      # 3. THE LOG CATCHER (Runs even if the step above fails)
      - name: Upload Xcode Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-lighthouse-build-log
          path: xcodebuild.log
          
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then exit 1; fi
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
