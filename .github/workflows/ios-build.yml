name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder (Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Write Optimized Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                end
              end
              
              installer.aggregate_targets.each do |target|
                target.user_project.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                end
                target.user_project.save
              end
            end
          end
          EOF
      
      
      
      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Native Project Sanitization (Ruby)
        run: |
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project_path = "ios/Pods/Pods.xcodeproj"
            
            if File.exist?(project_path)
              project = Xcodeproj::Project.open(project_path)
              abs_root = Dir.pwd
              
              # Scripts we need to run, but whose file-tracking breaks Xcode 16
              hang_phases = ["FBReactNativeSpec", "Constants.manifest", "[Expo] Configure", "Bundle React Native"]
              
              project.targets.each do |target|
                target.build_phases.each do |phase|
                  if phase.isa == "PBXShellScriptBuildPhase"
                    
                    # 1. The Hermes Silver Bullet (Fixes the Node crash)
                    if target.name.include?("hermes-engine")
                      env_vars = "export PODS_ROOT=\"#{abs_root}/ios/Pods\"\n"
                      env_vars += "export REACT_NATIVE_PATH=\"#{abs_root}/node_modules/react-native\"\n"
                      if !phase.shell_script.include?("export PODS_ROOT")
                        phase.shell_script = env_vars + phase.shell_script
                      end
                    end
                    
                    # 2. The Dependency Hang Fix (Fixes Xcode freezing, keeps Codegen alive)
                    if hang_phases.any? { |k| (phase.name || "").include?(k) }
                      phase.input_paths = []
                      phase.output_paths = []
                      phase.input_file_list_paths = []
                      phase.output_file_list_paths = []
                    end
                    
                  end
                end
              end
              
              project.save
            end
          '
     
      - name: Manual Module Map Emplacement
        run: |
          # The directory where Xcode 16.4 is looking for modules
          DEST="build/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates/ProjectLightHouseReactApp/BuildProductsPath/Release-iphoneos"
          
          # Modules listed in your error log
          MODULES=("EXConstants" "Expo" "ExpoAsset" "ExpoFileSystem" "ExpoFont" "ExpoImagePicker" "ExpoKeepAwake" "ExpoModulesCore")

          for MOD in "${MODULES[@]}"; do
            echo "Searching for $MOD.modulemap..."
            # Find the actual modulemap file in the Pods directory
            MAP_PATH=$(find ios/Pods -name "$MOD.modulemap" | head -n 1)
            
            if [ -n "$MAP_PATH" ]; then
              mkdir -p "$DEST/$MOD"
              cp "$MAP_PATH" "$DEST/$MOD/"
              echo "✅ Placed $MOD.modulemap in $DEST/$MOD/"
            else
              echo "⚠️ Warning: $MOD.modulemap not found in ios/Pods"
            fi
          done
          
      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            HEADER_SEARCH_PATHS='$(inherited) "${PODS_ROOT}/Headers/Public/React-graphics" "${PODS_ROOT}/Headers/Public/React-renderer-graphics" "$(SRCROOT)/../node_modules/react-native/ReactCommon"' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_MODULE_DEBUGGING=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            VALIDATE_WORKSPACE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            OTHER_CFLAGS="-Wno-ambiguous-column-numbers" \
            GCC_PRECOMPILE_PREFIX_HEADER=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_BUNDLING=YES \
            OTHER_CPLUSPLUSFLAGS="-fno-aligned-allocation"

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
