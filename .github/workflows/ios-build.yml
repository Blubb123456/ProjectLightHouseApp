         # EOF
          
          #pod install --repo-update
      - name: Patch Podfile for iOS 15.1
        run: |
          cd ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          
          # Use Python to safely inject the logic without mangling line breaks
          python3 -c "
          import sys
          content = open('Podfile').read()
          # 1. Update the platform line
          import re
          content = re.sub(r'platform :ios, .*', 'platform :ios, \"15.1\"', content)
          # 2. Inject the target override logic correctly
          patch = \"\"\"
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
              end
            end
            react_native_post_install\"\"\"
          content = content.replace('react_native_post_install', patch)
          with open('Podfile', 'w') as f:
              f.write(content)
          "
      
      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          # This flag is the key to finding missing Expo specs
          pod install --repo-update
      - name: Manual JS Bundle
        run: |
          npx expo export:embed --platform ios --dev false --bundle-output ios/main.jsbundle --assets-dest ios
      
      - name: Setup Xcode Environment
        run: |
          cd ios
          # This tells Xcode exactly where the Node binary and the environment scripts are
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          # Link the helper script if it's missing from the expected path
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/ || true
          
      - name: Build Unsigned Archive
        run: |
          # 1. Discovery (same as before)
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          # 2. The "Stability" Build
          # CLANG_ENABLE_EXPLICIT_MODULES=NO fixes the 'PrecompileModule' scan crashes
          # COMPILER_INDEX_STORE_ENABLE=NO speeds up the runner and prevents I/O timeouts
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -parallelizeTargets=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            -jobs 1 \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_SWIFT_FLAGS="-no-warnings-as-errors" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          
          # 1. Try to find the app inside the Archive first
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)

          # 2. Fallback: Search DerivedData if Archive failed
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Archive not found, searching DerivedData..."
            APP_PATH=$(find /tmp/DerivedData -name "ProjectLightHouseReactApp.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app file found in Archive or DerivedData."
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
