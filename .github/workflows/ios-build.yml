name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Podfile and Project
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CLANG_ENABLE_EXPLICIT_MODULES'] = 'NO'
                  config.build_settings['CLANG_ENABLE_MODULE_DEBUGGING'] = 'NO'
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                end
              end
            end
          end
          EOF
          pod install

      - name: Force Fix Glog
        run: |
          GLOG_PATH="ios/Pods/glog"
          sudo mkdir -p "$GLOG_PATH/src"
          sudo chmod -R 777 "$GLOG_PATH"
          sudo tee "$GLOG_PATH/src/config.h" > /dev/null <<EOF
          #define GOOGLE_GLOG_DLL_DECL
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_UNISTD_H 1
          EOF
          sudo touch "$GLOG_PATH/src/logging.cc" "$GLOG_PATH/src/raw_logging.cc" "$GLOG_PATH/src/utilities.cc"
          
      - name: Overwrite Hermes Source
        run: |
          python3 - <<'EOF'
          import os
          path = 'node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              if '#include <thread>' not in content:
                  content = '#include <thread>\n#include <atomic>\n' + content
              content = content.replace('std::thread::id expected', 'auto expected')
              content = content.replace('std::make_shared<DecoratedRuntime>(runtime, debuggerName_)', 
                                      'std::shared_ptr<DecoratedRuntime>(new DecoratedRuntime(runtime, debuggerName_))')
              content = content.replace('return std::make_unique<HermesExecutor>(runtime,', 
                                      'return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),')
              with open(path, 'w') as f:
                  f.write(content)
          EOF

      - name: Manual JS Bundle (Fixing the Black Box)
        run: |
          export NODE_BINARY=$(command -v node)
          # We create the bundle manually so we can see JS errors here
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios
          
          # Tell Xcode where the bundle is
          mkdir -p build/ProjectLighthouse.xcarchive/Products/Applications/ProjectLightHouseReactApp.app
          cp ios/main.jsbundle build/ProjectLighthouse.xcarchive/Products/Applications/ProjectLightHouseReactApp.app/main.jsbundle || true

      - name: Build Unsigned Archive
        run: |
          # Force Node path for Xcode 16
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local
          
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath $(pwd)/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            SKIP_BUNDLING=YES \
            clean archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -n 1)
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
