name: Build ProjectLighthouse IPA (Unsigned)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Step 1: Environment Setup ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          yarn install
          cd ios && pod install && cd ..

      # --- Step 2: Build the .app Bundle ---
      - name: Build Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLighthouse.xcworkspace \
            -scheme ProjectLighthouse \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ProjectLighthouse.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      # --- Step 3: Package as IPA (JustFrederik's Logic) ---
      - name: Convert .app to .ipa
        run: |
          mkdir -p Payload
          # Copy the .app bundle from the archive to the Payload folder
          cp -r build/ProjectLighthouse.xcarchive/Products/Applications/ProjectLighthouse.app Payload/
          # Zip the Payload folder and rename to .ipa
          zip -r ProjectLighthouse.ipa Payload
          
      # --- Step 4: Upload the Result ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-Unsigned-IPA
          path: ProjectLighthouse.ipa
