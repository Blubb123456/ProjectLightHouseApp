name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Configure Podfile and Project
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'
          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false
          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!
            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )
            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                end
                # This fixes the "with-environment.sh" missing error
                target.build_phases.each do |phase|
                  if phase.respond_to?(:shell_script)
                    phase.shell_script = "export REACT_NATIVE_PATH=\"$(pwd)/../node_modules/react-native\"\n" + phase.shell_script
                  end
                end
              end
            end
          end
          EOF
          pod install
      - name: Surgical Source Overwrite
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            python3 -c "import os; path = '$FILE'; content = open(path).read(); content = content.replace('std::make_shared<DecoratedRuntime>(', 'std::shared_ptr<DecoratedRuntime>(new DecoratedRuntime('); content = content.replace('std::make_unique<HermesExecutor>(', 'std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),'); open(path, 'w').write(content)"
            echo "✅ Source overwritten successfully."
          else
            echo "❌ File not found: $FILE"
            exit 1
          fi

      - name: Build Unsigned Archive
        run: |
          rm -rf build/DerivedData
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            USE_HEADERMAP=NO \
            REACT_NATIVE_PATH="$REACT_NATIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_MODULES=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
