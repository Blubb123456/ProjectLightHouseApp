name: Build ProjectLighthouse IPA (No Apple ID)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Removed the cache line to prevent the lock file error

      - name: Install Dependencies
        run: |
          # Use npm if you don't have a yarn.lock file
          if [ -f "yarn.lock" ]; then
            yarn install
          else
            npm install
          fi

      # --- Step 1: Generate the iOS Folder ---
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --no-install

      # --- Step 2: Install CocoaPods (Force clean) ---
      - name: Install Pods
        run: |
          cd ios
          
          # 1. Define the fix we want to inject
          FIX_LOGIC="    installer.pods_project.targets.each do |target|\n      target.build_configurations.each do |config|\n        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''\n        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n      end\n    end"

          # 2. Use sed to insert the fix right after Expo's 'post_install do |installer|' line
          sed -i '' "/post_install do |installer|/a\\
          $FIX_LOGIC
          " Podfile

          # 3. Now run the install
          pod install
          cd ..

      # --- Step 3: Build the .app Bundle (With Error 65 Fixes) ---
      - name: Build Archive
        run: |
          # Create the build directory manually to avoid path errors
          mkdir -p build
          
          # Find the workspace and scheme dynamically
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ProjectLighthouse.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO
      # --- Step 4: Package as IPA (JustFrederik Logic) ---
      - name: Convert .app to .ipa
        run: |
          mkdir -p Payload
          # Finds the .app folder inside the archive automatically
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r ProjectLighthouse.ipa Payload
          
      # --- Step 5: Upload the Result ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-Unsigned-IPA
          path: ProjectLighthouse.ipa
