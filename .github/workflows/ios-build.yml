name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Xcode 16.x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @tensorflow/tfjs @tensorflow/tfjs-react-native expo-gl expo-camera expo-image-picker expo-file-system expo-constants expo-asset expo-font
          npm install --save-dev @expo/metro-config @react-native/metro-config

      - name: Generate iOS Folder & Configure Podfile
        run: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          # We overwrite the Podfile with the correct syntax and the "Surgical Fixes"
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false
          use_frameworks! :linkage => :static

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # 1. Global Header & Modular Fixes
                  config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited) '
                  config.build_settings['HEADER_SEARCH_PATHS'] << '"$(PODS_ROOT)/Headers/Public" '
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                  # 2. Xcode 16 Permissions & Sandbox
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  
                  # 3. Optimization & Stability
                  config.build_settings['GCC_OPTIMIZATION_LEVEL'] = '0'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['COPY_PHASE_STRIP'] = 'NO'

                  if target.name == 'ZXingObjC'
                    config.build_settings['USER_HEADER_SEARCH_PATHS'] = '"$(PODS_ROOT)/ZXingObjC/**"'
                  end
                end
              end
            end
          end # This was the missing 'end' for the target block
          EOF
          
          pod install --repo-update

      - name: Manual JS Bundle
        run: |
          npx expo export:embed --platform ios --dev false --bundle-output ios/main.jsbundle --assets-dest ios
      
      - name: Setup Xcode Environment
        run: |
          cd ios
          # This tells Xcode exactly where the Node binary and the environment scripts are
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          # Link the helper script if it's missing from the expected path
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/ || true
          
      - name: Build Unsigned Archive
        run: |
          # 1. Setup environment
          export NODE_BINARY=$(command -v node)
          
          # 2. Fix the Scheme/Target mismatch
          # We force the scheme to match what Expo actually generated
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          cd ios
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          cd ..
          echo "Building Scheme: $SCHEME_NAME"
          sudo mkdir -p /scripts/xcode
          sudo cp ../node_modules/react-native/scripts/xcode/with-environment.sh /scripts/xcode/
          sudo chmod +x /scripts/xcode/with-environment.sh
          cd ..
          cd ios
          # Point the NODE_BINARY to the actual runner path
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local
          
          # Fix the symlink for the script Hermes is looking for
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/
          cd ..
          # 3. The Clean Build Command
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/DerivedData \
            -jobs 1 \
            SKIP_BUNDLING=1 \
            -parallelizeTargets=NO \
            -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            USE_HEADERMAP=NO \
            OTHER_CFLAGS='$(inherited) -Wno-error=non-modular-include-in-framework-module' \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-error=non-modular-include-in-framework-module' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROJECT_DIR=$(pwd)/ios \
            PODS_ROOT=$(pwd)/ios/Pods \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          
          # 1. Try to find the app inside the Archive first
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)

          # 2. Fallback: Search DerivedData if Archive failed
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Archive not found, searching DerivedData..."
            APP_PATH=$(find /tmp/DerivedData -name "ProjectLightHouseReactApp.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app file found in Archive or DerivedData."
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
