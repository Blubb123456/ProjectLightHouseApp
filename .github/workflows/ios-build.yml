name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        # Standard prebuild, no flags that cause dependency map errors
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Write Optimized Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  # Fix the Swift optimization warning from your logs
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  # Required for Xcode 16.4 C++ stability
                  config.build_settings['OTHER_CPLUSPLUSFLAGS'] = '-Wno-error=non-modular-include-in-framework-module'
                end
              end
            end
          end
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Deep Patch Hermes Source
        run: |
          # 1. Physically remove the header symlinks that cause the 1-vs-6 arg conflict
          rm -rf ios/Pods/Headers/Public/React-hermes
          rm -rf ios/Pods/Headers/Public/hermes-engine
          
          # 2. Patch the .cpp file with the EXACT namespace for facebook::jsi
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            # This handles the smart pointer conversion error directly
            sed -i '' 's/return std::make_unique<HermesExecutor>(/return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),/g' "$FILE"
            echo "✅ Patched HermesExecutorFactory.cpp"
          fi

          # 3. Force the header to be public and clean
          HEADER="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.h"
          if [ -f "$HEADER" ]; then
            sed -i '' 's/class HermesExecutor : public JSIExecutor {/class HermesExecutor : public JSIExecutor { public:/g' "$HEADER"
            echo "✅ Patched HermesExecutorFactory.h"
          fi

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            USE_HEADERMAP=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ProjectLighthouse.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
