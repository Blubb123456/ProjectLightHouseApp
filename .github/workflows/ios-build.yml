          #end # This was the missing 'end' for the target block
         # EOF
          
          #pod install --repo-update
      - name: Clean Cache and Fix Podfile
        run: |
          # 1. This must be a shell command, OUTSIDE the python block
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          
          cd ios
          # 2. Use a HEREDOC for Python to avoid quote-nesting hell
          python3 << 'EOF'
          import re
          import os

          podfile_path = 'Podfile'
          with open(podfile_path, 'r') as f:
              content = f.read()

          # Set the deployment target globally in the Podfile text
          content = re.sub(r"platform :ios, .*", "platform :ios, '15.1'", content)

          # This logic string is injected into the post_install block
          # We use \$ to escape the dollar signs so Ruby handles them, not the Shell
          fix_logic = """
            react_native_post_install(installer)
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -no-verify-emitted-module-interface'
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
            end
          """

          # Replace the existing post_install block
          if 'post_install do |installer|' in content:
              pattern = r'post_install do \|installer\|.*?end'
              # Re-insert the block with the fix_logic
              content = re.sub(pattern, f"post_install do |installer|{fix_logic}end", content, flags=re.DOTALL)

          with open(podfile_path, 'w') as f:
              f.write(content)
          EOF
          
      - name: Patch Hermes for Xcode 16
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          if [ -f "$FILE" ]; then
            echo "Patching HermesExecutorFactory.cpp..."
            sed -i '' 's/return delegate/return this->delegate/g' "$FILE"
          fi
    
      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          # This flag is the key to finding missing Expo specs
          pod install --repo-update
      - name: Manual JS Bundle
        run: |
          npx expo export:embed --platform ios --dev false --bundle-output ios/main.jsbundle --assets-dest ios
      
      - name: Setup Xcode Environment
        run: |
          cd ios
          # This tells Xcode exactly where the Node binary and the environment scripts are
          echo "export NODE_BINARY=$(command -v node)" > .xcode.env
          echo "export PATH=$PATH" >> .xcode.env
          # Link the helper script if it's missing from the expected path
          mkdir -p scripts/xcode
          cp ../node_modules/react-native/scripts/xcode/with-environment.sh scripts/xcode/ || true
      
      - name: Fix Podfile Syntax & Set Xcode 16 Compatibility
        run: |
          cd ios
          python3 -c "
          import re
          import os
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          with open('Podfile', 'r') as f:
              content = f.read()

          # 1. Ensure the platform is set to 15.1
          content = re.sub(r'platform :ios, .*', 'platform :ios, \"15.1\"', content)

          # 2. Define the refined post_install logic
          # We include the Swift verification bypass and the ExpoModulesCore precompile fix
          fix_logic = \"\"\"
            react_native_post_install(installer)
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'gnu++20'
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['DEFINES_MODULE'] = 'YES'
                # Fix for Xcode 16 Swift Module interface failures
                config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -no-verify-emitted-module-interface'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['LIBRARY_SEARCH_PATHS'] = ['$(inherited)', '$(TOOLCHAIN_DIR)/usr/lib/swift/iphoneos', '$(TOOLCHAIN_DIR)/usr/lib/swift-5.0/iphoneos']
              end
              
              # Specific bypass for ExpoModulesCore bridging header issues in Xcode 16
              if target.name == 'ExpoModulesCore'
                target.build_configurations.each do |config|
                  config.build_settings['SWIFT_PRECOMPILE_BRIDGING_HEADER'] = 'NO'
                  config.build_settings['OTHER_SWIFT_FLAGS'] = '$(inherited) -Xfrontend -disable-modules-validate-system-headers'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                end
              end
            end
          \"\"\"

          # 3. Inject the logic into the post_install block
          if 'post_install do |installer|' in content:
              # This regex finds the post_install block and replaces its internal content
              pattern = r'(post_install do \|installer\|)(.*?)(\n  end)'
              content = re.sub(pattern, r'\\1' + fix_logic + r'\\3', content, flags=re.DOTALL)
          
          with open('Podfile', 'w') as f:
              f.write(content)
          "
      
      - name: Bulletproof Patch for Hermes Executor
        run: |
          # 1. Reset the file to erase our previous sed damage
          git checkout node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp || true
          
          # 2. Use a Node script for safe, multiline regex replacement
          cat << 'EOF' > patch-hermes.js
          const fs = require('fs');
          const file = 'node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp';
          
          if (fs.existsSync(file)) {
            let code = fs.readFileSync(file, 'utf8');
            
            // Fix A: Add missing <thread> header for Xcode 16
            // (Resolves 'undeclared identifier expected' and 'no member named thread')
            if (!code.includes('#include <thread>')) {
              code = '#include <thread>\n' + code;
            }
            
            // Fix B: Explicit pointer cast
            // (Resolves 'static_cast from __compressed_pair... not related by inheritance')
            code = code.replace(
              /return std::make_unique<HermesExecutor>\(\s*decoratedRuntime,/g,
              'return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(decoratedRuntime),'
            );
            
            fs.writeFileSync(file, code);
            console.log('✅ Hermes patched successfully via Node.js.');
          } else {
            console.log('⚠️ HermesExecutorFactory.cpp not found.');
          }
          EOF
          
          node patch-hermes.js
          rm patch-hermes.js
          
      - name: Build Unsigned Archive
        run: |
          # 1. Discovery (same as before)
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)

          # 2. The "Stability" Build
          # CLANG_ENABLE_EXPLICIT_MODULES=NO fixes the 'PrecompileModule' scan crashes
          # COMPILER_INDEX_STORE_ENABLE=NO speeds up the runner and prevents I/O timeouts
          set -o pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $(pwd)/build/ProjectLighthouse.xcarchive \
            -destination "generic/platform=iOS" \
            -parallelizeTargets=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            -jobs 1 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++20" \
            OTHER_CPLUSPLUSFLAGS="-std=gnu++20" \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_SWIFT_FLAGS="-no-warnings-as-errors" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | grep -v "Disabling previews" | tee xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          
          # 1. Try to find the app inside the Archive first
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)

          # 2. Fallback: Search DerivedData if Archive failed
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ Archive not found, searching DerivedData..."
            APP_PATH=$(find /tmp/DerivedData -name "ProjectLightHouseReactApp.app" -type d | grep "Release-iphoneos" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app file found in Archive or DerivedData."
            exit 1
          fi

          echo "✅ Found App at: $APP_PATH"
          cp -R "$APP_PATH/" build/Payload/
          cd build && zip -yr ProjectLighthouse.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
