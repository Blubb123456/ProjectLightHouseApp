name: "Build Unsigned iOS IPA"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate iOS Folder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Write Final Podfile
        run: |
          cd ios
          cat <<'EOF' > Podfile
          require_relative '../node_modules/expo/scripts/autolinking'
          require_relative '../node_modules/react-native/scripts/react_native_pods'

          platform :ios, '15.1'
          install! 'cocoapods', :deterministic_uuids => false

          target 'ProjectLightHouseReactApp' do
            use_expo_modules!
            config = use_native_modules!

            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true,
              :fabric_enabled => false,
              :new_arch_enabled => false
            )

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                  config.build_settings['GCC_PRECOMPILE_PREFIX_HEADER'] = 'NO'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'
                  config.build_settings['SWIFT_OPTIMIZATION_LEVEL'] = '-Onone'
                  # This prevents the specific "1 argument vs 6" header confusion
                  config.build_settings['USE_HEADERMAP'] = 'NO'
                end
              end
            end
          end
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Overwrite Hermes Source
        run: |
          FILE="node_modules/react-native/ReactCommon/hermes/executor/HermesExecutorFactory.cpp"
          
          if [ -f "$FILE" ]; then
            echo "Manually overwriting HermesExecutorFactory.cpp to bypass Xcode 16.4 C++ bugs..."
            
            # We are using a python script to do a targeted find-and-replace that is 
            # more robust than sed for multi-line C++ blocks.
            python3 -c "
            import os

            path = '$FILE'
            with open(path, 'r') as f:
            content = f.read()

            # Fix 1: Replace make_shared with a direct new call to avoid allocate_shared templates
            old_make_shared = 'auto decoratedRuntime = std::make_shared<DecoratedRuntime>('
            new_shared_ptr = 'auto decoratedRuntime = std::shared_ptr<DecoratedRuntime>(new DecoratedRuntime('
            content = content.replace(old_make_shared, new_shared_ptr)

            # Fix 2: Explicitly cast the runtime to jsi::Runtime to satisfy the 6-arg constructor
            old_executor = 'return std::make_unique<HermesExecutor>('
            new_executor = 'return std::make_unique<HermesExecutor>(std::static_pointer_cast<facebook::jsi::Runtime>(runtime),'
            content = content.replace(old_executor, new_executor)


          fi

      - name: Final Project Sanitization
        run: |
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/Pods/Pods.xcodeproj")
            abs_root = Dir.pwd
            
            project.targets.each do |target|
              # Fix Hermes script paths
              if target.name.include?("hermes-engine")
                target.build_phases.each do |phase|
                  if phase.isa == "PBXShellScriptBuildPhase"
                    phase.shell_script = "export REACT_NATIVE_PATH=\"#{abs_root}/node_modules/react-native\"\n" + phase.shell_script
                  end
                end
              end
              
              target.build_configurations.each do |config|
                config.build_settings["CLANG_CXX_LANGUAGE_STANDARD"] = "c++20"
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                config.build_settings["USE_HEADERMAP"] = "NO"
                # This ensures the compiler doesnt fail on modular include warnings
                config.build_settings["OTHER_CPLUSPLUSFLAGS"] = "-Wno-error=non-modular-include-in-framework-module -Wno-error=return-type"
              end
            end
            project.save
          '
      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -workspace ios/ProjectLightHouseReactApp.xcworkspace \
            -scheme ProjectLightHouseReactApp \
            -configuration Release \
            -archivePath build/ProjectLighthouse.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -parallelizeTargets=NO \
            -jobs 1 \
            -allowProvisioningUpdates \
            ONLY_ACTIVE_ARCH=NO \
            REACT_NATIVE_PATH="$(pwd)/node_modules/react-native" \
            USE_HEADERMAP=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" | head -1)
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ProjectLighthouse.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-IPA
          path: build/ProjectLighthouse.ipa
