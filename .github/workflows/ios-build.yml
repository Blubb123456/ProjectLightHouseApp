name: Build ProjectLighthouse IPA (No Apple ID)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Removed the cache line to prevent the lock file error

      - name: Install Dependencies
        run: |
          # Use npm if you don't have a yarn.lock file
          if [ -f "yarn.lock" ]; then
            yarn install
          else
            npm install
          fi

      # --- Step 1: Generate the iOS Folder ---
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios

      # --- Step 2: Install CocoaPods ---
      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # --- Step 3: Build the .app Bundle (Unsigned) ---
      - name: Build Archive
        run: |
          # Automatically find the workspace name generated by Expo
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          echo "Building workspace: $WORKSPACE_PATH with scheme: $SCHEME_NAME"

          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ProjectLighthouse.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # --- Step 4: Package as IPA (JustFrederik Logic) ---
      - name: Convert .app to .ipa
        run: |
          mkdir -p Payload
          # Finds the .app folder inside the archive automatically
          APP_PATH=$(find build/ProjectLighthouse.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r ProjectLighthouse.ipa Payload
          
      # --- Step 5: Upload the Result ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLighthouse-Unsigned-IPA
          path: ProjectLighthouse.ipa
